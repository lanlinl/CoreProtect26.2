name: Build Minecraft Plugin

# 触发条件：手动触发 (workflow_dispatch)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取代码
      - name: Checkout Repository
        uses: actions/checkout@v5

      # 2. 设置 JDK 25 环境
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven' # 开启 Maven 依赖缓存，加速构建

      # 3. 代码质量检查与单元测试
      - name: Build with Maven (Test & Verify)
        run: mvn -B clean verify --file pom.xml

      # 4. 打包插件 JAR 文件
      - name: Package Plugin JAR
        run: mvn -B package -DskipTests --file pom.xml

      # 5. 上传构建产物 (Artifacts)
      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v6
        with:
          name: Minecraft-Plugin-JAR-JDK25
          path: target/*.jar
          retention-days: 7
          if-no-files-found: error
